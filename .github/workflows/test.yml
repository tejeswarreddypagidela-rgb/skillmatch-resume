name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Verify generated HTML pages are in sync with templates/
        run: |
          npm run build
          git diff --exit-code -- '*.html' || {
            echo "::error::Generated HTML pages don't match templates/ -- run 'npm run build' and commit the result.";
            exit 1;
          }
